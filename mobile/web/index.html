<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d31"><title>WODM-world medals</title><link rel="stylesheet" href="app.css?v=0.011"><link rel="stylesheet" href="theme.css?v=0.011"><link rel="stylesheet" href="space.css?v=0.011"><link rel="stylesheet" href="reading.css?v=0.011"><link rel="stylesheet" href="refinement.css?v=0.011"><link rel="stylesheet" href="encyclopedia.css?v=0.011"><link rel="stylesheet" href="folio.css?v=0.011"><link rel="stylesheet" href="projection.css"></head>
<body><div id="personal-background" aria-hidden="true"></div><div id="atmosphere" aria-hidden="true"></div>
<section id="splash" aria-label="正在打开图鉴">
  <div class="splash-watermark" aria-hidden="true"></div>
  <div id="motifs" aria-label="点击纹样让它掉落"></div>
  <div class="loading-bottom"><p id="load-message" role="status" hidden></p><div id="track"><div id="bar"></div><span id="loading-runner" aria-hidden="true"><img id="sweat" src="loading-smile.png" alt=""></span></div><button id="skip" hidden>关闭</button></div>
</section>
<header><img src="icon.png" alt=""><h1>WODM-world medals</h1></header>
<main>
 <div id="browse">
  <div class="filters"><label class="search"><span class="sr-only">搜索名称、年代、等级</span><input id="query" type="search" enterkeyhint="search" placeholder="搜索名称、年代、等级" autocomplete="off"></label><select id="volume" hidden aria-hidden="true"><option value="">国家/时期</option></select></div>
  <div id="home-book"><button id="book-previous" aria-label="左侧书页，上一页"></button><button id="book-next" aria-label="右侧书页，下一页"></button><div id="book-stage" aria-hidden="true"><div id="book-fallback"><div class="fallback-back"></div><div class="fallback-pages"></div><div class="fallback-cover"></div></div></div><button id="book-open" aria-label="打开图鉴，开始查询"><span class="sr-only">打开图鉴，开始查询</span></button></div><div id="projection-beam" aria-hidden="true"></div><section id="reading-book" aria-label="图鉴书页"><button id="close-reading" hidden aria-label="向回翻页并合书"></button><button id="projection-previous" aria-label="上一页"></button><button id="projection-next" aria-label="下一页"></button><div id="page-scroll"><p id="written-query"></p><div id="country-matches" hidden></div>
  <div class="section-heading"><h2 id="section-title">图鉴</h2><span id="count" role="status"></span></div>
  <div id="results"></div><p id="empty" hidden>没有符合条件的条目。试试其他名称或清除筛选。</p><button id="more" class="wide" hidden>显示更多</button></div></section>
 </div>
 <section id="categories" hidden><h2>分类</h2><button id="favorite-entry" class="wide">我的收藏</button><h3>大洲 / 地区 / 国家 / 时期</h3><div id="category-list"></div></section><section id="settings" hidden><h2>设置</h2><p id="edition"></p><label class="setting"><span>颜色主题</span><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label class="setting"><span>背景颜色</span><input id="background-color" type="color" value="#f7f6f2"></label><label class="setting"><span>空间效果</span><select id="space-effect"><option value="fog">流动雾气</option><option value="still">静态深空</option></select></label><label class="setting"><span>雾气主色</span><input id="fog-color-a" type="color" value="#66819c"></label><label class="setting"><span>雾气辅色</span><input id="fog-color-b" type="color" value="#756389"></label><label class="setting"><span>背景图片</span><input id="background-file" type="file" accept="image/*"></label><label class="setting"><span>背景虚化 <output id="blur-value">18</output></span><input id="background-blur" type="range" min="0" max="32" value="18" aria-label="背景虚化"></label><button id="reset-background" class="wide">恢复默认背景</button><details id="cover-settings"><summary>书的封面与封底</summary><label class="setting"><span>封面图片</span><input id="cover-front" type="file" accept="image/*"></label><label class="setting"><span>封底图片</span><input id="cover-back" type="file" accept="image/*"></label><label class="setting"><span>图片适配</span><select id="cover-fit"><option value="contain">完整显示</option><option value="cover">居中填满</option></select></label><button id="reset-covers" class="wide">恢复素面书</button><div class="cover-prompt-actions"><button data-copy-prompt="front-prompt">复制封面提示词</button><button data-copy-prompt="back-prompt">复制封底提示词</button></div><p id="cover-status" role="status"></p></details><button id="updates" class="wide">检查 GitHub 更新</button><label class="setting"><span>减少动态效果</span><input id="reduced" type="checkbox"></label><p id="update-status" role="status"></p></section>
</main>
<nav aria-label="主导航"><button data-tab="catalog" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v16c3-2 6-2 10 0 4-2 7-2 10 0V4c-2-1-6-2-10 1Zm0 0v15"/></svg>图鉴</button><button data-tab="categories"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3Zm11 0h7v7h-7ZM3 14h7v7H3Zm11 0h7v7h-7Z"/></svg>分类</button><button data-tab="settings"><svg viewBox="0 0 24 24"><path d="m9 2-1 3-3 1-3 5 2 3v3l5 4 3-1 3 1 5-4v-3l2-3-3-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg>设置</button></nav>
<dialog id="viewer"><div class="viewer-toolbar"><button id="close-viewer" aria-label="关闭大图">关闭</button><button id="zoom">放大</button><button id="save">收藏</button></div><div id="photo-scroll"><img id="full-photo" alt=""></div><p id="photo-caption"></p><div class="viewer-toolbar"><button id="previous">上一图</button><span id="photo-number"></span><button id="next">下一图</button></div><details><summary>名称、版型与来源</summary><div id="detail"></div></details></dialog>
<script src="compat.js?v=0.011"></script><script src="version.js?v=0.011"></script><script src="hierarchy.js?v=0.011"></script><script src="search.js?v=0.011"></script><script src="vendor/hanzi-writer.min.js?v=0.011"></script><script src="ink.js?v=0.011"></script><script src="award-intros.js?v=0.011"></script><script src="vendor/tiny-pinyin.js?v=0.011"></script><script src="reference-policy.js"></script><script src="award-precedence.js"></script><script src="encyclopedia.js?v=0.011"></script><script src="app.js?v=0.011"></script><script src="vendor/three.min.js?v=0.011"></script><script src="reader-motion.js"></script><script src="book-surface.js"></script><script src="book3d.js?v=0.011"></script><script src="easter.js?v=0.011"></script><script src="folio.js?v=0.011"></script><script src="customization.js?v=0.011"></script><script src="catalog.js?v=0.011" onerror="catalogFailed()"></script><script>startCatalog();</script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d31"><title>全球勋奖章图鉴</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="space.css"><link rel="stylesheet" href="reading.css"><link rel="stylesheet" href="refinement.css"><link rel="stylesheet" href="encyclopedia.css"></head>
<body><div id="personal-background" aria-hidden="true"></div><div id="atmosphere" aria-hidden="true"></div>
<section id="splash" aria-label="正在打开图鉴">
  <div class="splash-watermark" aria-hidden="true"></div>
  <div id="motifs" aria-label="点击纹样让它掉落"></div>
  <div class="loading-bottom"><p id="load-message" role="status" hidden></p><div id="track"><div id="bar"></div><span id="loading-runner" aria-hidden="true"><img id="sweat" src="loading-smile.png" alt=""></span></div><button id="skip" hidden>关闭</button></div>
</section>
<header><img src="icon.png" alt=""><h1>全球勋奖章图鉴</h1></header>
<main>
 <div id="browse">
  <div class="filters"><label class="search"><span class="sr-only">搜索名称、年代、等级</span><input id="query" type="search" enterkeyhint="search" placeholder="搜索名称、年代、等级" autocomplete="off"></label><button id="open-countries" aria-haspopup="dialog">国家/时期 <span aria-hidden="true">⌄</span></button><select id="volume" hidden aria-hidden="true"><option value="">国家/时期</option></select></div>
  <div id="home-book"><div id="book-stage" aria-hidden="true"><div id="book-fallback"><div class="fallback-back"></div><div class="fallback-pages"></div><div class="fallback-cover"></div></div></div><button id="book-open" aria-label="打开图鉴，开始查询"><span class="sr-only">打开图鉴，开始查询</span></button></div><section id="reading-book" aria-label="图鉴书页"><button id="close-reading" hidden aria-label="向回翻页并合书"></button><div class="reading-spine" aria-hidden="true"></div><div id="page-scroll"><p id="written-query"></p><div id="country-matches" hidden></div>
  <div class="section-heading"><h2 id="section-title">图鉴</h2><span id="count" role="status"></span></div>
  <div id="results"></div><p id="empty" hidden>没有符合条件的条目。试试其他名称或清除筛选。</p><button id="more" class="wide" hidden>显示更多</button></div></section>
 </div>
 <section id="categories" hidden><h2>分类</h2><button id="favorite-entry" class="wide">我的收藏</button><h3>大洲 / 地区 / 国家 / 时期</h3><div id="category-list"></div></section><section id="settings" hidden><h2>设置</h2><p id="edition"></p><label class="setting"><span>颜色主题</span><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label class="setting"><span>背景颜色</span><input id="background-color" type="color" value="#f7f6f2"></label><label class="setting"><span>空间效果</span><select id="space-effect"><option value="fog">流动雾气</option><option value="still">静态深空</option></select></label><label class="setting"><span>雾气主色</span><input id="fog-color-a" type="color" value="#66819c"></label><label class="setting"><span>雾气辅色</span><input id="fog-color-b" type="color" value="#756389"></label><label class="setting"><span>背景图片</span><input id="background-file" type="file" accept="image/*"></label><label class="setting"><span>背景虚化 <output id="blur-value">18</output></span><input id="background-blur" type="range" min="0" max="32" value="18" aria-label="背景虚化"></label><button id="reset-background" class="wide">恢复默认背景</button><details id="cover-settings"><summary>书的封面与封底</summary><label class="setting"><span>封面图片</span><input id="cover-front" type="file" accept="image/*"></label><label class="setting"><span>封底图片</span><input id="cover-back" type="file" accept="image/*"></label><label class="setting"><span>图片适配</span><select id="cover-fit"><option value="contain">完整显示</option><option value="cover">居中填满</option></select></label><button id="reset-covers" class="wide">恢复素面书</button><details><summary>AI 生成／改图提示词</summary><label for="front-prompt">封面提示词</label><textarea id="front-prompt" rows="6"></textarea><button data-copy-prompt="front-prompt">复制封面提示词</button><label for="back-prompt">封底提示词</label><textarea id="back-prompt" rows="6"></textarea><button data-copy-prompt="back-prompt">复制封底提示词</button><p class="muted">可修改后复制到你使用的生图工具；生成的图片再从上方选择。</p></details><p id="cover-status" role="status"></p></details><button id="authorize-updates" class="wide">私有仓库更新授权</button><button id="updates" class="wide">检查 GitHub 更新</button><button id="replay" class="wide">重看加载动画</button><label class="setting"><span>减少动态效果</span><input id="reduced" type="checkbox"></label><p class="muted">图鉴随 APK 一起更新。已有内容可离线查看；安装新版时收藏会保留。</p><p class="muted">图片为等比手机预览，来源原图保留在项目中。仅用于个人研究；出处与权利说明沿用原库。</p><p id="update-status" role="status"></p></section>
</main>
<nav aria-label="主导航"><button data-tab="catalog" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v16c3-2 6-2 10 0 4-2 7-2 10 0V4c-2-1-6-2-10 1Zm0 0v15"/></svg>图鉴</button><button data-tab="categories"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3Zm11 0h7v7h-7ZM3 14h7v7H3Zm11 0h7v7h-7Z"/></svg>分类</button><button data-tab="settings"><svg viewBox="0 0 24 24"><path d="m9 2-1 3-3 1-3 5 2 3v3l5 4 3-1 3 1 5-4v-3l2-3-3-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg>设置</button></nav>
<dialog id="country-picker" aria-labelledby="country-picker-title"><div class="picker-heading"><h2 id="country-picker-title">国家/时期</h2><button id="close-countries">关闭</button></div><input id="country-search" type="search" placeholder="搜索国家或时期" aria-label="搜索国家或时期"><button id="clear-country" class="wide">清除选择</button><div id="country-options"></div></dialog><dialog id="viewer"><div class="viewer-toolbar"><button id="close-viewer" aria-label="关闭大图">关闭</button><button id="zoom">放大</button><button id="save">收藏</button></div><div id="photo-scroll"><img id="full-photo" alt=""></div><p id="photo-caption"></p><div class="viewer-toolbar"><button id="previous">上一图</button><span id="photo-number"></span><button id="next">下一图</button></div><details><summary>名称、版型与来源</summary><div id="detail"></div></details></dialog>
<script src="compat.js"></script><script src="version.js"></script><script src="hierarchy.js"></script><script src="search.js"></script><script src="vendor/hanzi-writer.min.js"></script><script src="ink.js"></script><script src="encyclopedia.js"></script><script src="app.js"></script><script src="vendor/three.min.js"></script><script src="book3d.js"></script><script src="easter.js"></script><script src="customization.js"></script><script src="catalog.js" onerror="catalogFailed()"></script><script>startCatalog();</script>
</body></html>

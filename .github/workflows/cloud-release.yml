name: Build and replace private latest APK
on:
  push:
    branches: [codex/cloud-updates, main]
    paths: ['.github/workflows/cloud-release.yml', 'mobile/cloud/**', 'cloud/updates/**', 'mobile/version.json', 'mobile/android/**', 'mobile/web/**', 'data/release-input.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-medals-private-latest
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required build tools
        run: |
          python -m pip install -r mobile/requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore cloud inputs, apply approved images, build and replace latest
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
        run: python mobile/cloud/release.py

name: Check private source checkout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r mobile/requirements.txt
      - name: Check build source syntax (no source image corpus in Git)
        run: python -m py_compile mobile/scripts/export_catalog.py mobile/scripts/prepare_display.py mobile/scripts/release_input.py mobile/scripts/build_apk.py mobile/scripts/package_release.py
